version: 2
registries:
  # The Open OCPP Trace SDK (@open-ocpp-trace/*, see .npmrc): GitHub Packages
  # needs a token with read:packages even for a public package.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: "/"
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node tracks the Node major pinned in mise.toml.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: "/deploy/cloudflare"
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    # The Cloudflare example's Dockerfile repeats the root runtime stage: keep
    # their base images in step.
    directories:
      - "/"
      - "/deploy/cloudflare"
    schedule:
      interval: weekly
