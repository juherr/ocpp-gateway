services:
  ocpp-gateway:
    build: .
    expose:
      - "9000"
    # The application must listen on the container network for Coolify's proxy.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "9000"
      LISTEN_HOST: 0.0.0.0
      ROUTES_FILE: /app/routes.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Provide your routing table (see routes.example.json).
      - "${ROUTES_HOST_PATH:-./routes.json}:/app/routes.json:ro"
    restart: unless-stopped
